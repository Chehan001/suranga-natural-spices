<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F8FAF9">
  <link rel="icon" href="/Logo.png" type="image/png">
  <meta name="description" content="Suranga Agro agricultural business management">
  <title>Suranga Agro</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('suranga-agro:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      console.warn('Could not read the saved theme preference.', error);
    }
  </script>
</head>
<body>
  <button id="nav-backdrop" class="nav-backdrop" type="button" data-act="closeNav" aria-label="Close navigation menu" hidden></button>
  <aside id="sidebar" aria-label="Main navigation" aria-hidden="true" inert>
    <div class="brand">
      <img class="brand-logo" src="/Logo.png" width="34" height="34" alt="" aria-hidden="true">
      <span>Suranga Agro</span>
    </div>
    <button id="close-nav-btn" class="close-nav-btn" type="button" data-act="closeNav" aria-label="Close navigation menu"></button>
    <nav id="nav"></nav>
    <div class="sidebar-landscape" aria-hidden="true">
      <img id="sidebar-landscape-image" alt="">
    </div>
  </aside>
  <main id="app">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" type="button" data-act="toggleNav" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false" aria-haspopup="dialog"></button>
      <div class="mobile-brand" aria-label="Suranga Agro">
        <img class="brand-logo" src="/Logo.png" width="30" height="30" alt="" aria-hidden="true">
        <span>Suranga Agro</span>
      </div>
      <h1 id="page-title"></h1>
      <button id="theme-toggle" class="theme-toggle" type="button" data-act="toggleTheme" aria-pressed="false"></button>
      <span id="api-status" data-state="checking" role="status" aria-live="polite">Checking API…</span>
      <div id="today" class="date-card" aria-label="Current date in Sri Lanka">
        <span class="date-icon" aria-hidden="true"></span>
        <span class="date-copy"><strong>Today</strong><time id="today-value"></time></span>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
